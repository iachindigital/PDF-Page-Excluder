<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 逆向页码计算器</title>
    <!-- 引入 Tailwind CSS 让界面保持现代、简洁 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white rounded-xl shadow-md p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">PDF 逆向页码计算器</h1>
        <p class="text-gray-600 text-sm mb-6">输入 PDF 总页数以及**不打印**的页数，自动生成可以直接复制到打印机里的剩余页码。</p>

        <!-- 表单区域 -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">PDF 总页数</label>
                <input type="number" id="totalPage" min="1" placeholder="例如：20" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">不需要打印的页数（支持逗号和连字符）</label>
                <input type="text" id="excludePages" placeholder="例如：1-2, 4-10, 12" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <span class="text-xs text-gray-400 mt-1 block">提示：支持单页（如 5）和连续页（如 4-10），用英文逗号分隔。</span>
            </div>

            <button onclick="calculate()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200">
                生成打印页码
            </button>
        </div>

        <!-- 结果区域 -->
        <div id="resultContainer" class="mt-6 hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">可直接复制的打印页码：</label>
            <div class="flex items-center space-x-2">
                <input type="text" id="resultOutput" readonly 
                    class="w-full bg-gray-100 px-3 py-2 border border-gray-300 rounded-lg text-gray-800 font-mono focus:outline-none">
                <button onclick="copyResult()" 
                    class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg text-sm transition duration-200 whitespace-nowrap">
                    复制
                </button>
            </div>
            <p id="errorMsg" class="text-xs text-red-500 mt-2 hidden"></p>
        </div>
    </div>

    <script>
        function parsePageRanges(str, maxPage) {
            let set = new Set();
            if (!str.trim()) return set;
            
            let parts = str.split(',');
            for (let part of parts) {
                part = part.trim();
                if (!part) continue;
                if (part.includes('-')) {
                    let sub = part.split('-');
                    if (sub.length === 2) {
                        let start = parseInt(sub[0]);
                        let end = parseInt(sub[1]);
                        if (!isNaN(start) && !isNaN(end)) {
                            for (let i = Math.max(1, start); i <= Math.min(maxPage, end); i++) {
                                set.add(i);
                            }
                        }
                    }
                } else {
                    let num = parseInt(part);
                    if (!isNaN(num) && num >= 1 && num <= maxPage) {
                        set.add(num);
                    }
                }
            }
            return set;
        }

        function calculate() {
            let total = parseInt(document.getElementById('totalPage').value);
            let excludeStr = document.getElementById('excludePages').value;
            let resultContainer = document.getElementById('resultContainer');
            let resultOutput = document.getElementById('resultOutput');
            let errorMsg = document.getElementById('errorMsg');

            resultContainer.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            if (isNaN(total) || total <= 0) {
                errorMsg.innerText = "请输入有效的 PDF 总页数！";
                errorMsg.classList.remove('hidden');
                resultOutput.value = "";
                return;
            }

            // 1. 获取排除的页数集合
            let excludeSet = parsePageRanges(excludeStr, total);

            // 2. 计算剩余需要打印的页数
            let includeList = [];
            for (let i = 1; i <= total; i++) {
                if (!excludeSet.has(i)) {
                    includeList.push(i);
                }
            }

            if (includeList.length === 0) {
                resultOutput.value = "";
                errorMsg.innerText = "错误：所有页面都被排除了，没有可打印的页面！";
                errorMsg.classList.remove('hidden');
                return;
            }

            // 3. 将连续的页码压缩成区间形式 (例如: 3, 11, 13-20)
            let ranges = [];
            let start = includeList[0];
            let prev = start;

            for (let i = 1; i < includeList.length; i++) {
                let curr = includeList[i];
                if (curr === prev + 1) {
                    prev = curr;
                } else {
                    ranges.appendRange(start, prev);
                    start = curr;
                    prev = curr;
                }
            }
            ranges.appendRange(start, prev);

            // 辅助扩展方法向数组追加区间字符串
            function appendRange(s, e) {
                if (s === e) {
                    ranges.push(s.toString());
                } else if (e === s + 1) {
                    ranges.push(s.toString());
                    ranges.push(e.toString());
                } else {
                    ranges.push(`${s}-${e}`);
                }
            }
            // 重新绑定正确的逻辑
            let compressed = [];
            let rStart = includeList[0];
            let rPrev = rStart;

            for (let i = 1; i < includeList.length; i++) {
                let curr = includeList[i];
                if (curr === rPrev + 1) {
                    rPrev = curr;
                } else {
                    compressed.push(rStart === rPrev ? `${rStart}` : `${rStart}-${rPrev}`);
                    rStart = curr;
                    rPrev = curr;
                }
            }
            compressed.push(rStart === rPrev ? `${rStart}` : `${rStart}-${rPrev}`);

            resultOutput.value = compressed.join(', ');
        }

        function copyResult() {
            let copyText = document.getElementById('resultOutput');
            copyText.select();
            copyText.setSelectionRange(0, 99999); // 适配移动端
            navigator.clipboard.writeText(copyText.value).then(() => {
                alert("已复制到剪贴板！");
            });
        }
    </script>
</body>
</html>
