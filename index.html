<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 逆向页码计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white rounded-xl shadow-md p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">PDF 逆向页码计算器</h1>
        <p class="text-gray-600 text-sm mb-6">输入 PDF 总页数以及**不打印**的页数，自动生成可以直接复制到打印机里的剩余页码。</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">PDF 总页数</label>
                <input type="number" id="totalPage" min="1" placeholder="例如：20" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">不需要打印的页数（支持逗号和连字符）</label>
                <input type="text" id="excludePages" placeholder="例如：1-3, 5, 7-10" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <span class="text-xs text-gray-400 mt-1 block">提示：支持单页（如 5）和连续页（如 4-10），用英文逗号分隔。</span>
            </div>

            <button onclick="runCalculation()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200">
                生成打印页码
            </button>
        </div>

        <div id="resultContainer" class="mt-6 hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">可直接复制的打印页码：</label>
            <div class="flex items-center space-x-2">
                <input type="text" id="resultOutput" readonly 
                    class="w-full bg-gray-100 px-3 py-2 border border-gray-300 rounded-lg text-gray-800 font-mono focus:outline-none">
                <button onclick="copyResult()" 
                    class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg text-sm transition duration-200 whitespace-nowrap">
                    复制
                </button>
            </div>
            <p id="errorMsg" class="text-xs text-red-500 mt-2 hidden"></p>
        </div>
    </div>

    <script>
        function runCalculation() {
            const total = parseInt(document.getElementById('totalPage').value);
            const excludeStr = document.getElementById('excludePages').value;
            const resultContainer = document.getElementById('resultContainer');
            const resultOutput = document.getElementById('resultOutput');
            const errorMsg = document.getElementById('errorMsg');

            resultContainer.classList.remove('hidden');
            errorMsg.classList.add('hidden');

            if (isNaN(total) || total <= 0) {
                errorMsg.innerText = "请输入有效的 PDF 总页数！";
                errorMsg.classList.remove('hidden');
                resultOutput.value = "";
                return;
            }

            // 1. 解析排除的页码
            let excludeSet = new Set();
            if (excludeStr.trim() !== "") {
                excludeStr.split(',').forEach(part => {
                    let range = part.trim().split('-');
                    if (range.length === 2) {
                        let start = parseInt(range[0]);
                        let end = parseInt(range[1]);
                        if (!isNaN(start) && !isNaN(end)) {
                            for (let i = Math.max(1, start); i <= Math.min(total, end); i++) {
                                excludeSet.add(i);
                            }
                        }
                    } else if (range.length === 1 && range[0] !== "") {
                        let num = parseInt(range[0]);
                        if (!isNaN(num) && num >= 1 && num <= total) {
                            excludeSet.add(num);
                        }
                    }
                });
            }

            // 2. 筛选出需要打印的页码
            let include = [];
            for (let i = 1; i <= total; i++) {
                if (!excludeSet.has(i)) {
                    include.push(i);
                }
            }

            if (include.length === 0) {
                resultOutput.value = "";
                errorMsg.innerText = "错误：所有页面都被排除了！";
                errorMsg.classList.remove('hidden');
                return;
            }

            // 3. 完美压缩连续区间
            let ranges = [];
            let start = include[0];
            let prev = include[0];

            for (let i = 1; i < include.length; i++) {
                if (include[i] === prev + 1) {
                    prev = include[i];
                } else {
                    ranges.push(start === prev ? `${start}` : `${start}-${prev}`);
                    start = include[i];
                    prev = include[i];
                }
            }
            ranges.push(start === prev ? `${start}` : `${start}-${prev}`);

            resultOutput.value = ranges.join(', ');
        }

        function copyResult() {
            let copyText = document.getElementById('resultOutput');
            copyText.select();
            navigator.clipboard.writeText(copyText.value).then(() => {
                alert("已复制到剪贴板！");
            });
        }
    </script>
</body>
</html>
