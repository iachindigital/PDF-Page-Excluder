<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PDF 逆向页码计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">PDF 逆向页码计算器</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium">PDF 总页数</label>
                <input type="number" id="totalPage" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium">不需要打印的页数</label>
                <input type="text" id="excludePages" placeholder="例如：1-2, 4-10, 12" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <button onclick="runCalculation()" class="w-full bg-blue-600 text-white py-2 rounded-lg">生成打印页码</button>
        </div>

        <div id="resultContainer" class="mt-6 hidden">
            <label class="block text-sm font-medium">可直接复制的打印页码：</label>
            <div class="flex space-x-2">
                <input type="text" id="resultOutput" readonly class="w-full bg-gray-100 px-3 py-2 border rounded-lg font-mono">
                <button onclick="copyResult()" class="bg-gray-800 text-white px-4 py-2 rounded-lg">复制</button>
            </div>
        </div>
    </div>

    <script>
        function runCalculation() {
            const total = parseInt(document.getElementById('totalPage').value);
            const excludeStr = document.getElementById('excludePages').value;
            if (isNaN(total)) return;

            // 1. 解析排除页码
            let excludeSet = new Set();
            excludeStr.split(',').forEach(part => {
                let range = part.trim().split('-');
                if (range.length === 2) {
                    for (let i = parseInt(range[0]); i <= parseInt(range[1]); i++) excludeSet.add(i);
                } else if (range.length === 1 && range[0] !== "") {
                    excludeSet.add(parseInt(range[0]));
                }
            });

            // 2. 生成包含页码
            let include = [];
            for (let i = 1; i <= total; i++) {
                if (!excludeSet.has(i)) include.push(i);
            }

            // 3. 压缩区间
            let ranges = [];
            if (include.length > 0) {
                let start = include[0], prev = include[0];
                for (let i = 1; i <= include.length; i++) {
                    if (include[i] !== prev + 1) {
                        ranges.push(start === prev ? `${start}` : `${start}-${prev}`);
                        start = include[i];
                        prev = include[i];
                    } else {
                        prev = include[i];
                    }
                }
            }

            document.getElementById('resultOutput').value = ranges.join(', ');
            document.getElementById('resultContainer').classList.remove('hidden');
        }

        function copyResult() {
            navigator.clipboard.writeText(document.getElementById('resultOutput').value);
            alert("已复制！");
        }
    </script>
</body>
</html>
