<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 逆向页码计算器 - 专业旗舰版</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen p-4 flex justify-center items-center text-slate-100 transition-colors duration-200">
    <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-xl p-6 sm:p-8">
        <!-- 头部：标题与模式切换 -->
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">PDF 智能页码计算器</h1>
                <p class="text-slate-400 text-xs mt-1">支持排除法、白名单指定、奇偶筛选及区间自动压缩。</p>
            </div>
            <!-- 模式切换按钮 -->
            <button onclick="toggleMode()" id="modeBtn" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg border border-slate-600 transition">
                模式: 排除不需要的页
            </button>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">PDF 总页数</label>
                <input type="number" id="totalPage" oninput="runCalculation()" placeholder="例如：20" 
                    class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-100 placeholder-slate-500">
            </div>

            <div>
                <label id="inputLabel" class="block text-sm font-medium text-slate-300 mb-1">不需要打印的页数</label>
                <input type="text" id="excludePages" oninput="runCalculation()" placeholder="例如：1-3, 5, 7-10" 
                    class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-100 placeholder-slate-500">
                <!-- 快捷标签 -->
                <div class="flex space-x-3 mt-1.5 text-xs text-blue-400">
                    <span class="cursor-pointer hover:underline" onclick="setPages('1')">【去除首页】</span>
                    <span class="cursor-pointer hover:underline" onclick="setPages('1-3')">【去除前3页】</span>
                    <span class="cursor-pointer hover:underline" onclick="quickCoverAndBack()">【去除首尾】</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-4 text-sm pt-1">
                <label class="cursor-pointer flex items-center"><input type="radio" name="parity" value="all" checked onchange="runCalculation()" class="mr-1.5 accent-blue-500"> 全部</label>
                <label class="cursor-pointer flex items-center"><input type="radio" name="parity" value="odd" onchange="runCalculation()" class="mr-1.5 accent-blue-500"> 仅奇数</label>
                <label class="cursor-pointer flex items-center"><input type="radio" name="parity" value="even" onchange="runCalculation()" class="mr-1.5 accent-blue-500"> 仅偶数</label>
                <button onclick="resetAll()" class="text-rose-400 hover:text-rose-300 ml-auto text-xs">清空重置</button>
            </div>
        </div>

        <div id="resultContainer" class="mt-6 border-t border-slate-700 pt-4">
            <label class="block text-sm font-medium text-slate-300 mb-1">可直接复制的打印页码：</label>
            <div class="flex items-center space-x-2">
                <input type="text" id="resultOutput" readonly class="w-full bg-slate-900 px-3 py-2.5 border border-slate-700 rounded-xl font-mono text-sm text-emerald-400 outline-none">
                <button id="copyBtn" onclick="copyResult()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl text-sm transition whitespace-nowrap shadow-lg shadow-blue-600/20">复制</button>
            </div>
            <div class="flex justify-between items-center mt-2.5">
                <p id="stats" class="text-xs text-slate-400"></p>
                <p id="warningMsg" class="text-xs text-amber-400 hidden"></p>
            </div>
        </div>
    </div>

    <script>
        let isIncludeMode = false; // false = 排除模式, true = 白名单（指定打印）模式

        function toggleMode() {
            isIncludeMode = !isIncludeMode;
            const btn = document.getElementById('modeBtn');
            const label = document.getElementById('inputLabel');
            const input = document.getElementById('excludePages');
            
            if (isIncludeMode) {
                btn.innerText = "模式: 仅打印指定页（白名单）";
                btn.classList.replace('bg-slate-700', 'bg-blue-900/60');
                label.innerText = "指定要打印的页数";
                input.placeholder = "例如：5, 8, 12-15";
            } else {
                btn.innerText = "模式: 排除不需要的页";
                btn.classList.replace('bg-blue-900/60', 'bg-slate-700');
                label.innerText = "不需要打印的页数";
                input.placeholder = "例如：1-3, 5, 7-10";
            }
            runCalculation();
        }

        function runCalculation() {
            const totalVal = document.getElementById('totalPage').value;
            let pageStr = document.getElementById('excludePages').value;
            
            pageStr = pageStr.replace(/，/g, ',').replace(/－/g, '-');
            pageStr = pageStr.replace(/,\s*$/, '').replace(/-\s*$/, '');

            const total = parseInt(totalVal);
            const stats = document.getElementById('stats');
            const resultOutput = document.getElementById('resultOutput');
            const warningMsg = document.getElementById('warningMsg');
            const parity = document.querySelector('input[name="parity"]:checked').value;

            warningMsg.classList.add('hidden');

            if (isNaN(total) || total <= 0) {
                resultOutput.value = "";
                stats.innerText = "";
                return;
            }

            let targetSet = new Set();
            let hasOutOfBounds = false;

            if (pageStr.trim() !== "") {
                pageStr.split(',').forEach(part => {
                    let r = part.trim().split('-');
                    if (r.length === 2) {
                        let start = parseInt(r[0]);
                        let end = parseInt(r[1]);
                        if (!isNaN(start) && !isNaN(end)) {
                            for (let i = Math.min(start, end); i <= Math.max(start, end); i++) {
                                if (i >= 1 && i <= total) {
                                    targetSet.add(i);
                                } else {
                                    hasOutOfBounds = true;
                                }
                            }
                        }
                    } else if (r.length === 1 && r[0] !== "") {
                        let n = parseInt(r[0]);
                        if (!isNaN(n)) {
                            if (n >= 1 && n <= total) {
                                targetSet.add(n);
                            } else {
                                hasOutOfBounds = true;
                            }
                        }
                    }
                });
            }

            if (hasOutOfBounds) {
                warningMsg.innerText = "⚠️ 注意：部分页码超出了总页数范围";
                warningMsg.classList.remove('hidden');
            }

            let include = [];
            for (let i = 1; i <= total; i++) {
                let condition = isIncludeMode ? targetSet.has(i) : !targetSet.has(i);
                if (condition) {
                    if (parity === 'odd' && i % 2 === 0) continue;
                    if (parity === 'even' && i % 2 !== 0) continue;
                    include.push(i);
                }
            }

            let ranges = [];
            if (include.length > 0) {
                let s = include[0], p = include[0];
                for (let i = 1; i <= include.length; i++) {
                    if (include[i] !== p + 1) {
                        ranges.push(s === p ? `${s}` : `${s}-${p}`);
                        s = include[i]; p = include[i];
                    } else { p = include[i]; }
                }
            }

            resultOutput.value = ranges.join(', ');
            if (isIncludeMode) {
                stats.innerText = `总计 ${total} 页，指定打印 ${include.length} 页`;
            } else {
                stats.innerText = `总计 ${total} 页，已排除 ${targetSet.size} 页，实际打印 ${include.length} 页`;
            }
        }

        function setPages(val) {
            document.getElementById('excludePages').value = val;
            runCalculation();
        }

        function quickCoverAndBack() {
            let total = parseInt(document.getElementById('totalPage').value);
            if (isNaN(total) || total <= 1) {
                document.getElementById('excludePages').value = '1';
            } else {
                document.getElementById('excludePages').value = `1, ${total}`;
            }
            if(isIncludeMode) toggleMode(); // 快捷去除首尾默认属于排除模式
            runCalculation();
        }

        function resetAll() {
            document.getElementById('totalPage').value = '';
            document.getElementById('excludePages').value = '';
            runCalculation();
        }

        function copyResult() {
            const btn = document.getElementById('copyBtn');
            const text = document.getElementById('resultOutput').value;
            if(!text) return;
            
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = "已复制 ✓";
                btn.classList.replace('bg-blue-600', 'bg-emerald-600');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.replace('bg-emerald-600', 'bg-blue-600');
                }, 2000);
            });
        }
    </script>
</body>
</html>
