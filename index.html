<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 逆向页码计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 flex justify-center">
    <div class="max-w-xl w-full bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold mb-4">PDF 逆向页码计算器</h1>

        <!-- 关键点：input 标签添加了 oninput="runCalculation()" -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">PDF 总页数</label>
                <input type="number" id="totalPage" oninput="runCalculation()" placeholder="输入总页数..." 
                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">不需要打印的页数</label>
                <input type="text" id="excludePages" oninput="runCalculation()" placeholder="例如：1-3, 5, 7-10" 
                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div class="flex items-center space-x-4 text-sm">
                <label><input type="radio" name="parity" value="all" checked onchange="runCalculation()"> 全部</label>
                <label><input type="radio" name="parity" value="odd" onchange="runCalculation()"> 仅奇数</label>
                <label><input type="radio" name="parity" value="even" onchange="runCalculation()"> 仅偶数</label>
                <button onclick="resetAll()" class="text-red-500 ml-auto">清空</button>
            </div>
        </div>

        <div id="resultContainer" class="mt-6">
            <label class="block text-sm font-medium text-gray-700">可复制的页码：</label>
            <div class="flex items-center space-x-2 mt-1">
                <input type="text" id="resultOutput" readonly class="w-full bg-gray-100 px-3 py-2 border rounded-lg font-mono text-sm">
                <button id="copyBtn" onclick="copyResult()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm">复制</button>
            </div>
            <p id="stats" class="text-xs text-gray-500 mt-2"></p>
        </div>
    </div>

    <script>
        function runCalculation() {
            const total = parseInt(document.getElementById('totalPage').value);
            let excludeStr = document.getElementById('excludePages').value;
            // 自动清洗：中英文符号替换
            excludeStr = excludeStr.replace(/，/g, ',').replace(/－/g, '-').replace(/ /g, '');
            
            const stats = document.getElementById('stats');
            const resultOutput = document.getElementById('resultOutput');
            const parity = document.querySelector('input[name="parity"]:checked').value;

            if (!total || total <= 0) {
                resultOutput.value = "";
                stats.innerText = "";
                return;
            }

            // 解析排除
            let excludeSet = new Set();
            excludeStr.split(',').forEach(part => {
                let r = part.split('-');
                if (r.length === 2) {
                    for (let i = Math.max(1, parseInt(r[0])); i <= Math.min(total, parseInt(r[1])); i++) excludeSet.add(i);
                } else if (r.length === 1 && r[0] !== "") {
                    let n = parseInt(r[0]);
                    if (n >= 1 && n <= total) excludeSet.add(n);
                }
            });

            // 筛选并生成
            let include = [];
            for (let i = 1; i <= total; i++) {
                if (!excludeSet.has(i)) {
                    if (parity === 'odd' && i % 2 === 0) continue;
                    if (parity === 'even' && i % 2 !== 0) continue;
                    include.push(i);
                }
            }

            // 压缩区间逻辑
            let ranges = [];
            if (include.length > 0) {
                let s = include[0], p = include[0];
                for (let i = 1; i <= include.length; i++) {
                    if (include[i] !== p + 1) {
                        ranges.push(s === p ? `${s}` : `${s}-${p}`);
                        s = include[i]; p = include[i];
                    } else { p = include[i]; }
                }
            }
            resultOutput.value = ranges.join(', ');
            stats.innerText = `总共 ${total} 页，已排除 ${excludeSet.size} 页，实际打印 ${include.length} 页`;
        }

        function resetAll() {
            document.getElementById('totalPage').value = '';
            document.getElementById('excludePages').value = '';
            runCalculation();
        }

        function copyResult() {
            const btn = document.getElementById('copyBtn');
            navigator.clipboard.writeText(document.getElementById('resultOutput').value).then(() => {
                btn.innerText = "已复制 ✓";
                setTimeout(() => btn.innerText = "复制", 2000);
            });
        }
    </script>
</body>
</html>
