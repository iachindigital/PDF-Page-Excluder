<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 逆向页码计算器 - 旗舰版</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 flex justify-center items-center">
    <div class="max-w-xl w-full bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold mb-1 text-gray-800">PDF 逆向页码计算器</h1>
        <p class="text-gray-500 text-xs mb-5">输入总页数与排除页数，实时生成打印页码，支持奇偶筛选与快捷模版。</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">PDF 总页数</label>
                <input type="number" id="totalPage" oninput="runCalculation()" placeholder="例如：20" 
                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">不需要打印的页数</label>
                <input type="text" id="excludePages" oninput="runCalculation()" placeholder="例如：1-3, 5, 7-10" 
                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <!-- 快捷标签 -->
                <div class="flex space-x-2 mt-1.5 text-xs text-blue-600">
                    <span class="cursor-pointer hover:underline" onclick="setExclude('1')">【去除首页】</span>
                    <span class="cursor-pointer hover:underline" onclick="setExclude('1-3')">【去除前3页】</span>
                    <span class="cursor-pointer hover:underline" onclick="quickCoverAndBack()">【去除首尾】</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-4 text-sm pt-1">
                <label class="cursor-pointer"><input type="radio" name="parity" value="all" checked onchange="runCalculation()" class="mr-1"> 全部</label>
                <label class="cursor-pointer"><input type="radio" name="parity" value="odd" onchange="runCalculation()" class="mr-1"> 仅奇数</label>
                <label class="cursor-pointer"><input type="radio" name="parity" value="even" onchange="runCalculation()" class="mr-1"> 仅偶数</label>
                <button onclick="resetAll()" class="text-red-500 hover:text-red-600 ml-auto text-xs">清空重置</button>
            </div>
        </div>

        <div id="resultContainer" class="mt-6 border-t pt-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">可直接复制的打印页码：</label>
            <div class="flex items-center space-x-2">
                <input type="text" id="resultOutput" readonly class="w-full bg-gray-100 px-3 py-2 border rounded-lg font-mono text-sm text-gray-800">
                <button id="copyBtn" onclick="copyResult()" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg text-sm transition whitespace-nowrap">复制</button>
            </div>
            <div class="flex justify-between items-center mt-2">
                <p id="stats" class="text-xs text-gray-500"></p>
                <span class="text-[10px] text-gray-400">提示：支持中英文标点及末尾悬空逗号自动忽略</span>
            </div>
        </div>
    </div>

    <script>
        function runCalculation() {
            const totalVal = document.getElementById('totalPage').value;
            let excludeStr = document.getElementById('excludePages').value;
            
            // 符号清洗：转换全角，并过滤掉末尾悬空的逗号（例如 "3, 9," 自动变成 "3, 9"）
            excludeStr = excludeStr.replace(/，/g, ',').replace(/－/g, '-');
            excludeStr = excludeStr.replace(/,\s*$/, '').replace(/-\s*$/, '');

            const total = parseInt(totalVal);
            const stats = document.getElementById('stats');
            const resultOutput = document.getElementById('resultOutput');
            const parity = document.querySelector('input[name="parity"]:checked').value;

            if (isNaN(total) || total <= 0) {
                resultOutput.value = "";
                stats.innerText = "";
                return;
            }

            // 解析排除页码
            let excludeSet = new Set();
            if (excludeStr.trim() !== "") {
                excludeStr.split(',').forEach(part => {
                    let r = part.trim().split('-');
                    if (r.length === 2) {
                        let start = parseInt(r[0]);
                        let end = parseInt(r[1]);
                        if (!isNaN(start) && !isNaN(end)) {
                            for (let i = Math.max(1, start); i <= Math.min(total, end); i++) excludeSet.add(i);
                        }
                    } else if (r.length === 1 && r[0] !== "") {
                        let n = parseInt(r[0]);
                        if (!isNaN(n) && n >= 1 && n <= total) excludeSet.add(n);
                    }
                });
            }

            // 筛选包含页码
            let include = [];
            for (let i = 1; i <= total; i++) {
                if (!excludeSet.has(i)) {
                    if (parity === 'odd' && i % 2 === 0) continue;
                    if (parity === 'even' && i % 2 !== 0) continue;
                    include.push(i);
                }
            }

            // 完美压缩区间
            let ranges = [];
            if (include.length > 0) {
                let s = include[0], p = include[0];
                for (let i = 1; i <= include.length; i++) {
                    if (include[i] !== p + 1) {
                        ranges.push(s === p ? `${s}` : `${s}-${p}`);
                        s = include[i]; p = include[i];
                    } else { p = include[i]; }
                }
            }

            resultOutput.value = ranges.join(', ');
            stats.innerText = `总计 ${total} 页，已排除 ${excludeSet.size} 页，实际打印 ${include.length} 页`;
        }

        function setExclude(val) {
            document.getElementById('excludePages').value = val;
            runCalculation();
        }

        function quickCoverAndBack() {
            let total = parseInt(document.getElementById('totalPage').value);
            if (isNaN(total) || total <= 1) {
                document.getElementById('excludePages').value = '1';
            } else {
                document.getElementById('excludePages').value = `1, ${total}`;
            }
            runCalculation();
        }

        function resetAll() {
            document.getElementById('totalPage').value = '';
            document.getElementById('excludePages').value = '';
            runCalculation();
        }

        function copyResult() {
            const btn = document.getElementById('copyBtn');
            const text = document.getElementById('resultOutput').value;
            if(!text) return;
            
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = "已复制 ✓";
                btn.classList.replace('bg-gray-800', 'bg-green-600');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.replace('bg-green-600', 'bg-gray-800');
                }, 2000);
            });
        }
    </script>
</body>
</html>
